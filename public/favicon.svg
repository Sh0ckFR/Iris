  <!-- Iris: the iris of an eye drawn as a camera aperture. Source of the app icons (npx tauri icon). -->
  <defs>
    <radialGradient id="tile" cx="0" cy="-60" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16240a"/>
      <stop offset="0.55" stop-color="#050803"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="iris" r="0.5" cx="0.5" cy="0.5">
      <stop offset="0.35" stop-color="#0a1203"/>
      <stop offset="0.8" stop-color="#25400a"/>
      <stop offset="1" stop-color="#76b900"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76b900" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="halo" r="0.5">
      <stop offset="0.55" stop-color="#76b900" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle r="300"/></clipPath>
  </defs>

